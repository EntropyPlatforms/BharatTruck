# REFERENCE ONLY — source of truth is nginx.conf.template
# URL map:
#   /api/auth/         -> bt-auth-service:3001
#   /api/kyc/          -> bt-auth-service:3001
#   /api/onboarding/   -> bt-auth-service:3001
#   /api/drivers/      -> bt-auth-service:3001
#   /api/fleet-owners/ -> bt-auth-service:3001
#   /api/me/           -> bt-auth-service:3001
#   /api/bookings/   -> bt-booking-service:3002
#   /api/quotes/     -> bt-booking-service:3002
#   /api/location/   -> bt-booking-service:3002
#   /api/me/         -> bt-booking-service:3002  (unified home feed; D-38)
#   /api/pricing/    -> bt-pricing-service:3003
#   /api/payments/   -> bt-payment-service:3004
#   /api/cargo/      -> bt-cargo-ledger:3005
#   /api/fleet/      -> bt-fleet-service:3007
#   /ws/             -> bt-booking-service:3002
#   /health          -> gateway itself

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {

  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 5s;

  gzip on;
  gzip_types application/json text/plain application/javascript;
  gzip_min_length 256;
  gzip_vary on;

  log_format main
    '$remote_addr [$time_local] '
    '"$request" $status $body_bytes_sent '
    'rt=$request_time urt=$upstream_response_time '
    'id=$req_id upstream=$upstream_addr '
    '"$http_user_agent"';

  access_log /var/log/nginx/access.log main;

  map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;
  }

  limit_req_zone $binary_remote_addr zone=otp_zone:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api_zone:20m rate=60r/m;
  limit_req_status 429;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id      $req_id;

  proxy_next_upstream error timeout http_502 http_503;
  proxy_next_upstream_timeout 5s;
  proxy_next_upstream_tries 2;

  server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    proxy_connect_timeout 30s;
    proxy_send_timeout    30s;
    proxy_read_timeout    90s;
    proxy_intercept_errors on;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Max-Age;

    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-Id" always;
    add_header Access-Control-Expose-Headers "X-Request-Id" always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    error_page 502 /errors/502.json;
    error_page 503 /errors/503.json;
    error_page 504 /errors/504.json;

    location /errors/502.json {
      internal;
      default_type application/json;
      return 502 '{"error":"bad_gateway","message":"Service temporarily unavailable. Please retry shortly."}\n';
    }
    location /errors/503.json {
      internal;
      default_type application/json;
      return 503 '{"error":"service_unavailable","message":"Service is starting up or under maintenance."}\n';
    }
    location /errors/504.json {
      internal;
      default_type application/json;
      return 504 '{"error":"gateway_timeout","message":"Service did not respond in time."}\n';
    }

    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok","service":"bt-gateway"}\n';
    }

    location /ws/ {
      set $booking_ws_upstream http://bt-booking-service:3002;
      rewrite ^/ws/(.*) /ws/$1 break;
      proxy_pass $booking_ws_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }

    location /api/auth/ {
      limit_req zone=otp_zone burst=10 nodelay;
      set $auth_upstream http://bt-auth-service:3001;
      rewrite ^/api/auth/(.*) /auth/$1 break;
      proxy_pass $auth_upstream;
    }
    location /api/kyc/ {
      limit_req zone=api_zone burst=20 nodelay;
      set $auth_kyc_upstream http://bt-auth-service:3001;
      rewrite ^/api/kyc/(.*) /kyc/$1 break;
      proxy_pass $auth_kyc_upstream;
    }
    location /api/onboarding/ {
      limit_req zone=api_zone burst=20 nodelay;
      set $auth_onboarding_upstream http://bt-auth-service:3001;
      rewrite ^/api/onboarding/(.*) /onboarding/$1 break;
      proxy_pass $auth_onboarding_upstream;
    }
    location /api/drivers/ {
      limit_req zone=api_zone burst=20 nodelay;
      set $auth_drivers_upstream http://bt-auth-service:3001;
      rewrite ^/api/drivers/(.*) /drivers/$1 break;
      proxy_pass $auth_drivers_upstream;
    }
    location /api/fleet-owners/ {
      limit_req zone=api_zone burst=20 nodelay;
      set $auth_fleet_owners_upstream http://bt-auth-service:3001;
      rewrite ^/api/fleet-owners/(.*) /fleet-owners/$1 break;
      proxy_pass $auth_fleet_owners_upstream;
    }
    location /api/me/ {
      limit_req zone=api_zone burst=20 nodelay;
      set $auth_me_upstream http://bt-auth-service:3001;
      rewrite ^/api/me/(.*) /me/$1 break;
      proxy_pass $auth_me_upstream;
    }

    location /api/bookings/ {
      limit_req zone=api_zone burst=30 nodelay;
      set $booking_upstream http://bt-booking-service:3002;
      rewrite ^/api/bookings/(.*) /bookings/$1 break;
      proxy_pass $booking_upstream;
    }
    location /api/quotes/ {
      limit_req zone=api_zone burst=30 nodelay;
      set $quotes_upstream http://bt-booking-service:3002;
      rewrite ^/api/quotes/(.*) /quotes/$1 break;
      proxy_pass $quotes_upstream;
    }
    location /api/location/ {
      limit_req zone=api_zone burst=60 nodelay;
      set $location_upstream http://bt-booking-service:3002;
      rewrite ^/api/location/(.*) /location/$1 break;
      proxy_pass $location_upstream;
    }
    # Unified home feed (bt-booking-service, routes mounted at /me). GET /api/me/feed
    # is the "what needs me right now?" aggregate (D-38); the service does its own
    # JWT + capability resolution.
    #
    # NOTE the specific prefix: /me/ is SHARED — the feed lives in bt-booking-service,
    # while /me/completeness and /me/acknowledgements live in bt-auth-service (the
    # /api/me/ block above). nginx longest-prefix matching sends /api/me/feed here and
    # everything else under /api/me/ to auth. Keep this block MORE specific than the
    # auth /api/me/ block; do not collapse the two — they route to different services.
    location /api/me/feed {
      limit_req zone=api_zone burst=30 nodelay;
      set $me_feed_upstream http://bt-booking-service:3002;
      rewrite ^/api/me/(.*) /me/$1 break;
      proxy_pass $me_feed_upstream;
    }

    # The feed's companion, GET /api/me/summary (persona dashboard panels), also in
    # bt-booking-service — more specific than /api/me/ for the same reason as the feed.
    location /api/me/summary {
      limit_req zone=api_zone burst=30 nodelay;
      set $me_summary_upstream http://bt-booking-service:3002;
      rewrite ^/api/me/(.*) /me/$1 break;
      proxy_pass $me_summary_upstream;
    }

    # The WhatsApp bot's webhook (bt-booking-service /whatsapp). Meta calls it; the service
    # checks Meta's signature on the raw body, which nginx passes through untouched.
    location /api/whatsapp/ {
      limit_req zone=api_zone burst=60 nodelay;
      set $whatsapp_upstream http://bt-booking-service:3002;
      rewrite ^/api/whatsapp/(.*) /whatsapp/$1 break;
      proxy_pass $whatsapp_upstream;
    }

    # Maps & Tracking read-through (bt-tracking-service :3006, routes mounted at /tracking).
    # App calls /api/tracking/route|eta|track/:bookingId ; service does its own JWT+RBAC.
    location /api/tracking/ {
      limit_req zone=api_zone burst=40 nodelay;
      set $tracking_upstream http://bt-tracking-service:3006;
      rewrite ^/api/tracking/(.*) /tracking/$1 break;
      proxy_pass $tracking_upstream;
    }

    location /api/pricing/ {
      limit_req zone=api_zone burst=30 nodelay;
      set $pricing_upstream http://bt-pricing-service:3003;
      rewrite ^/api/pricing/(.*) /pricing/$1 break;
      proxy_pass $pricing_upstream;
    }
    location /api/payments/ {
      limit_req zone=api_zone burst=20 nodelay;
      set $payment_upstream http://bt-payment-service:3004;
      rewrite ^/api/payments/(.*) /payments/$1 break;
      proxy_pass $payment_upstream;
    }
    location /api/cargo/ {
      limit_req zone=api_zone burst=20 nodelay;
      set $cargo_upstream http://bt-cargo-ledger:3005;
      rewrite ^/api/cargo/(.*) /cargo/$1 break;
      proxy_pass $cargo_upstream;
    }

    # Fleet-owner console (bt-fleet-service, routes mounted at /fleet).
    location /api/fleet/ {
      limit_req zone=api_zone burst=30 nodelay;
      set $fleet_upstream http://bt-fleet-service:3007;
      rewrite ^/api/fleet/(.*) /fleet/$1 break;
      proxy_pass $fleet_upstream;
    }

    location / {
      default_type application/json;
      return 404 '{"error":"not_found","message":"No route matched this path"}\n';
    }
  }
}
